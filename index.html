<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Life OS - Cloud</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- PANTALLA DE LOGIN / REGISTRO (Se muestra si no hay sesión) -->
    <div id="authScreen" class="flex-1 flex flex-col justify-center items-center p-4 max-w-sm mx-auto w-full">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-full space-y-4 shadow-xl">
            <div class="text-center space-y-1">
                <h1 class="font-bold text-xl text-indigo-400">⚡ Aura Life OS</h1>
                <p class="text-xs text-slate-400">Iniciá sesión o creá tu cuenta</p>
            </div>

            <div class="space-y-3">
                <input type="email" id="emailInput" placeholder="Correo electrónico" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2.5 text-sm outline-none text-slate-200 focus:border-indigo-500 transition">
                <input type="password" id="passInput" placeholder="Contraseña" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2.5 text-sm outline-none text-slate-200 focus:border-indigo-500 transition">
                
                <div class="flex gap-2 pt-2">
                    <button onclick="loginUser()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold py-2.5 rounded-lg transition shadow-lg shadow-indigo-600/30">Entrar</button>
                    <button onclick="registerUser()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold py-2.5 rounded-lg transition">Registrarse</button>
                </div>
            </div>
            <p id="authError" class="text-xs text-red-400 text-center h-4"></p>
        </div>
    </div>

    <!-- PANEL PRINCIPAL (Oculto hasta iniciar sesión) -->
    <div id="mainApp" class="flex-1 flex flex-col hidden">
        <!-- HEADER -->
        <header class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center sticky top-0 z-50 shadow-md">
            <div>
                <h1 class="font-bold text-base text-indigo-400">⚡ Aura Life OS</h1>
                <p class="text-xs text-slate-400" id="userEmailDisplay">Sincronizado</p>
            </div>
            <button onclick="logoutUser()" class="bg-red-950/60 hover:bg-red-900/60 border border-red-800/50 text-red-300 text-xs px-3 py-1.5 rounded-lg transition">Salir</button>
        </header>

        <!-- CONTENIDO -->
        <main class="flex-1 p-4 max-w-md mx-auto w-full space-y-6 pb-24">
            <!-- Barra de Captura Mágica -->
            <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 flex gap-2 shadow-lg">
                <input type="text" id="omniInput" placeholder="Ej: Mañana médico 16hs o gasté $4000..." class="bg-transparent flex-1 text-sm outline-none text-slate-200 placeholder-slate-500">
                <button onclick="processOmni()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition">✨ IA</button>
            </div>

            <!-- Sección Gym en Casa (Calistenia) -->
            <section class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-4 shadow-lg">
                <div class="flex justify-between items-center">
                    <h2 class="font-semibold text-sm text-indigo-300">💪 Calistenia en Casa</h2>
                    <span class="text-xs bg-indigo-950 text-indigo-300 px-2 py-0.5 rounded-full border border-indigo-800/50">Sin barra / Sin peso</span>
                </div>
                
                <div class="space-y-3">
                    <div class="bg-slate-950 p-3 rounded-lg border border-slate-800/60 space-y-2">
                        <div class="flex justify-between items-center">
                            <span class="text-sm font-medium text-slate-200">Flexiones Clásicas</span>
                            <span class="text-xs text-indigo-400 font-semibold" id="counter-flexiones">Series: 0/4</span>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="logSeries('Flexiones')" class="flex-1 bg-indigo-600/20 hover:bg-indigo-600/30 border border-indigo-500/40 text-indigo-300 text-xs py-1.5 rounded-lg font-medium transition">+1 Serie & Descanso</button>
                            <button onclick="resetSeries('Flexiones')" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-lg text-slate-300">↺</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Notas Rápidas -->
            <section class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3 shadow-lg">
                <h2 class="font-semibold text-sm text-indigo-300">📝 Notas y Recordatorios</h2>
                <div class="flex gap-2">
                    <input type="text" id="noteInput" placeholder="Escribir nota..." class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm flex-1 outline-none text-slate-200 placeholder-slate-500 focus:border-indigo-500 transition">
                    <button onclick="saveNote()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-4 py-2 rounded-lg font-medium transition">Guardar</button>
                </div>
                <div id="notesList" class="space-y-2 text-xs text-slate-300 pt-1"></div>
            </section>
        </main>
    </div>

    <!-- FIREBASE SDKs Y LOGICA -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, query, where, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC9C5o1cY9D8wRTn8F--XTgGGztuu9cyYQ",
            authDomain: "auralifeos-2d99e.firebaseapp.com",
            projectId: "auralifeos-2d99e",
            storageBucket: "auralifeos-2d99e.firebasestorage.app",
            messagingSenderId: "149152660489",
            appId: "1:149152660489:web:a093b7140e1921eb73ccd8"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentSeries = 0;

        // Registrar usuario nuevo
        window.registerUser = async () => {
            const email = document.getElementById('emailInput').value;
            const pass = document.getElementById('passInput').value;
            const errorElem = document.getElementById('authError');
            
            try {
                await createUserWithEmailAndPassword(auth, email, pass);
                errorElem.textContent = "";
            } catch (error) {
                errorElem.textContent = "Error al registrar: " + error.message;
            }
        };

        // Iniciar sesión
        window.loginUser = async () => {
            const email = document.getElementById('emailInput').value;
            const pass = document.getElementById('passInput').value;
            const errorElem = document.getElementById('authError');
            
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                errorElem.textContent = "";
            } catch (error) {
                errorElem.textContent = "Datos incorrectos o usuario no encontrado.";
            }
        };

        // Cerrar sesión
        window.logoutUser = async () => {
            await signOut(auth);
        };

        // Escuchar estado de autenticación
        onAuthStateChanged(auth, (user) => {
            const authScreen = document.getElementById('authScreen');
            const mainApp = document.getElementById('mainApp');
            const userEmailDisplay = document.getElementById('userEmailDisplay');

            if (user) {
                authScreen.classList.add('hidden');
                mainApp.classList.remove('hidden');
                userEmailDisplay.textContent = user.email;
                loadUserData(user.uid);
            } else {
                authScreen.classList.remove('hidden');
                mainApp.classList.add('hidden');
            }
        });

        // Guardar Notas en Firestore
        window.saveNote = async () => {
            const text = document.getElementById('noteInput').value;
            const user = auth.currentUser;
            if (!text.trim() || !user) return;

            try {
                await addDoc(collection(db, "notes"), {
                    uid: user.uid,
                    text: text,
                    createdAt: new Date()
                });
                document.getElementById('noteInput').value = '';
                loadUserData(user.uid);
            } catch (e) {
                console.error("Error al guardar:", e);
            }
        };

        // Cargar Notas de Firestore
        async function loadUserData(uid) {
            const notesList = document.getElementById('notesList');
            notesList.innerHTML = '';
            
            try {
                const q = query(collection(db, "notes"), where("uid", "==", uid));
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    notesList.innerHTML = `<p class="text-slate-500 italic">No hay notas guardadas todavía.</p>`;
                    return;
                }

                querySnapshot.forEach((documentSnap) => {
                    const data = documentSnap.data();
                    notesList.innerHTML += `
                        <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800/60 flex justify-between items-center">
                            <span class="text-slate-200">${data.text}</span>
                            <button onclick="deleteNote('${documentSnap.id}')" class="text-slate-500 hover:text-red-400 px-1 text-xs">✕</button>
                        </div>`;
                });
            } catch (e) {
                console.error("Error al cargar notas:", e);
            }
        }

        // Borrar Nota
        window.deleteNote = async (docId) => {
            try {
                await deleteDoc(doc(db, "notes", docId));
                loadUserData(auth.currentUser.uid);
            } catch (e) {
                console.error("Error al borrar:", e);
            }
        };

        window.logSeries = (exercise) => {
            if (currentSeries < 4) currentSeries++;
            document.getElementById(`counter-${exercise.toLowerCase()}`).textContent = `Series: ${currentSeries}/4`;
        };

        window.resetSeries = (exercise) => {
            currentSeries = 0;
            document.getElementById(`counter-${exercise.toLowerCase()}`).textContent = `Series: 0/4`;
        };

        window.processOmni = () => {
            const val = document.getElementById('omniInput').value;
            if(!val) return;
            alert("Captura mágica procesada: " + val);
            document.getElementById('omniInput').value = '';
        };
    </script>
</body>
</html>
